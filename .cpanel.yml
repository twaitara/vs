---
deployment:
  tasks:
    # ⚠️ Set DEPLOYPATH to the ABSOLUTE path of your /vs folder on the server.
    # Find it in cPanel File Manager: open the vs folder and read the path bar.
    # Common forms:
    #   /home/tonykett/public_html/vs
    #   /home/tonykett/nineonetwo.online/vs
    - export DEPLOYPATH=/home4/tonyketter/nineonetwo.online/vs
    - /bin/mkdir -p $DEPLOYPATH
    # Copy ALL app files + folders (lib_dompdf, assets, uploads) into the live folder.
    # config.php and valuation.sql are NOT in the repo (gitignored), so your
    # server credentials, BASE_URL and data are preserved on every deploy.
    - /bin/cp -R ./. $DEPLOYPATH/
    # Never expose the git repo or deploy config in the public web folder.
    - /bin/rm -rf $DEPLOYPATH/.git $DEPLOYPATH/.cpanel.yml $DEPLOYPATH/.gitignore
