<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Kennet Valuers</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0f1216;color:#e6e9ee;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:320px} .box img{max-width:150px;background:#fff;padding:10px;border-radius:12px;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 8px} p{color:#9aa4b2;font-size:14px;line-height:1.6}
  button{margin-top:18px;background:#d41d1d;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:15px;cursor:pointer}
</style></head>
<body>
  <div class="box">
    <img src="assets/logo2.png" alt="Kennet">
    <h1>You're offline</h1>
    <p>No internet connection right now. Reconnect to load valuations. Any details you were typing in a form are kept on your device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body></html>
